[package]
name = "maestro"
version = "0.4.4"
description = "Cross-platform GUI Agentic Development Environment wrapping Claude Code, Codex CLI, and Cursor Agent, organized around git projects and worktrees."
authors = ["Maestro contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maestro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "fs", "sync"] }
notify = "7"
notify-debouncer-full = "0.4"
nix = { version = "0.31.3", features = ["signal"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
regex = "1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = "2.9.0"
log = "0.4.33"
# Only the `system` half — Maestro reports on processes it spawned, and
# never touches sysinfo's disk/network/component collectors.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Aider's provider catalogs (OpenRouter's public model list, local Ollama/
# LM Studio endpoints). No other CLI needs HTTP — they all enumerate models
# through their own binary.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }
# Provider API keys go to the OS keychain, never to the `settings` table —
# that's a plaintext SQLite k/v store. See `agents/aider/credentials.rs`
# for the fallback when no keychain backend is available.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
