name: Release

permissions:
  contents: write

env:
  # Monaco's production bundle can exceed Node's default ~2 GB heap.
  NODE_OPTIONS: --max-old-space-size=4096

on:
  push:
    tags:
      - "v*"

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches application version
        run: pnpm version:check --tag "${GITHUB_REF_NAME}"

  release:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No `apt-get update` — these are long-standing Ubuntu 22.04 packages
      # that resolve fine against the index already baked into the runner
      # image, and skipping it avoids depending on GitHub's regional apt
      # mirror (live-observed hanging silently for 18+ minutes on a bad
      # mirror with no timeout to catch it, twice in a row on this exact
      # step). `Acquire::Retries`/`Timeout` on `install` itself is a
      # backstop for the same class of flakiness on the package-file
      # fetch, which still hits the network.
      - name: Install Linux Tauri build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The desktop's own frontend is built by Tauri itself
      # (`beforeBuildCommand` in `tauri.conf.json`), but the mobile web
      # app (`mobile/`, a separate Vite project the relay serves as a
      # bundled resource — see `relay/mod.rs`'s module doc) is not, so it
      # has to be built explicitly before the Rust build below: its
      # `bundle.resources` entry requires `mobile/dist` to already exist
      # the moment `cargo` compiles this crate, real bundle this time —
      # unlike `ci.yml`'s placeholder, this build actually ships.
      - name: Build the mobile web app
        run: pnpm --filter ./mobile build

      # `createUpdaterArtifacts` (tauri.conf.json) + these two secrets make
      # tauri-action sign every bundle it builds and publish/merge a
      # `latest.json` updater manifest on the release automatically — that
      # covers macOS and Windows. Linux's updater target is the AppImage
      # only (`.deb`/`.rpm` are owned by the OS package manager and can't
      # be self-updated), which is built and repaired in a later step
      # tauri-action never sees, so it gets signed and merged into the
      # manifest separately below.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Maestro ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's current linuxdeploy path forces XWayland and bundles an old
      # libwayland, which leaves a blank window on Mesa 25+ systems. Build the
      # AppImage separately, repair its AppDir, then package and upload the
      # corrected artifact. The deb/rpm bundles above are unaffected.
      - name: Build compatible Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `createUpdaterArtifacts` in tauri.conf.json makes *any* `tauri
          # build` try to sign its output the moment a pubkey is
          # configured — even this throwaway pre-repair build, which is
          # immediately replaced below and re-signed for real in the next
          # step. Without these, the CLI itself errors out here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          pnpm tauri build --bundles appimage

          appimage_dir="src-tauri/target/release/bundle/appimage"
          app_dir="$appimage_dir/Maestro.AppDir"
          version="${GITHUB_REF_NAME#v}"
          artifact="$appimage_dir/Maestro_${version}_amd64.AppImage"

          node scripts/fix-appimage.mjs "$app_dir"
          mv "$artifact" "$artifact.unpatched"

          (
            cd "$appimage_dir"
            ARCH=x86_64 \
              APPIMAGE_EXTRACT_AND_RUN=1 \
              LINUXDEPLOY_OUTPUT_VERSION="$version" \
              "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage" \
              --appdir=Maestro.AppDir
            mv "Maestro-${version}-x86_64.AppImage" "Maestro_${version}_amd64.AppImage"
          )

          gh release upload "$GITHUB_REF_NAME" "$artifact" --clobber

      # tauri-action never builds this artifact (see the step above), so
      # it's signed and folded into the release's `latest.json` here
      # instead of automatically. See `scripts/patch-updater-manifest.mjs`
      # for the known cross-job race this read-modify-write has with
      # tauri-action's own manifest merge for macOS/Windows.
      - name: Sign and publish the Linux updater manifest
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="src-tauri/target/release/bundle/appimage/Maestro_${version}_amd64.AppImage"

          pnpm tauri signer sign "$artifact"
          signature=$(cat "$artifact.sig")
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Maestro_${version}_amd64.AppImage"

          node scripts/patch-updater-manifest.mjs \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "linux-x86_64" "$download_url" "$signature"
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
