name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized application version
        run: pnpm version:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `tauri.conf.json`'s `bundle.resources` bundles the mobile web
      # app's build output (`../mobile/dist`, a separate Vite project —
      # see `relay/mod.rs`'s module doc) as a Tauri resource, and the
      # build script checks that path exists on *every* `cargo` invocation
      # that compiles this crate, `cargo fmt` excepted — including this
      # job's `clippy`/`test`, which have nothing to do with the mobile
      # app itself. A placeholder is enough for them; the real bundle is
      # only needed for an actual release build (`release.yml`).
      - name: Create placeholder mobile dist (unused by this job)
        run: |
          mkdir -p mobile/dist
          echo '<!doctype html><title>placeholder</title>' \
            > mobile/dist/index.html

      # The baked apt index in the runner image goes stale against a moving
      # mirror: the v0.11.0 release run died fetching
      # `gir1.2-polkit-1.0` / `libpolkit-gobject-1-dev` 0.105-33ubuntu0.1 —
      # versions the mirror had already superseded and pruned — and a
      # re-run on a *different* runner reproduced it byte-for-byte, so it
      # was the image's index, not one bad mirror node. Refreshing the index
      # is the only thing that clears that class.
      #
      # Which is what this job used to avoid doing: a bare `apt-get update`
      # depends on GitHub's regional apt mirror (live-observed hanging
      # silently for 18+ minutes on a bad mirror with no timeout to catch
      # it). So the update gets the same `Acquire::Retries`/`Timeout` options
      # the install already carries — a bad mirror now fails loudly in ~15s
      # per attempt instead of hanging with nothing to see.
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15
          sudo apt-get install -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
